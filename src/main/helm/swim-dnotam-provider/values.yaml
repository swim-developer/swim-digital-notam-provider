namespace: swim-demo

appName: swim-dnotam-provider

clusterDomain: apps-crc.testing

labels:
  app: swim-dnotam-provider
  app.kubernetes.io/part-of: swim-dnotam

image:
  repository: quay.io/masales/swim-dnotam-provider
  tag: latest
  pullPolicy: Always

replicas: 1

resources:
  requests:
    memory: 64Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: "1"

service:
  httpPort: 8080
  httpsPort: 8443

internalService:
  port: 9080

hpa:
  enabled: false

config:
  postgresHost: "dnotam-provider-postgres.swim-demo.svc.cluster.local"
  postgresPort: "5432"
  postgresDb: "swim-dnotam"
  amqpHost: "provider-artemis-amqps-0-svc.swim-demo.svc.cluster.local"
  amqpPort: "5671"
  artemisBrokerName: "provider-artemis"
  artemisJmxUrl: ""
  kafkaBootstrapServers: "kafka-kafka-bootstrap.swim-demo.svc.cluster.local:9092"
  kafkaTopic: "dnotam-events-all-topic"
  kafkaGroupId: "swim-dnotam-provider"
  kafkaPattern: "false"
  quarkusHttpPort: "8080"
  logLevel: "INFO"
  otelEnabled: "false"
  otelSdkDisabled: "true"
  otelEndpoint: ""
  otelHeaders: ""
  prometheusEnabled: "true"
  k8sSecretAddress: "provider-artemis-dnotam-address-bp"
  k8sSecretSecurity: "provider-artemis-dnotam-security-bp"

topics:
  config: '["RWY.CLS","TWY.CLS","STAND.STS","OBS.NEW","NAV.UNS","SAA.ACT"]'

secret:
  postgresUser: "swim-provider"
  postgresPassword: "swim-provider"
  amqpUsername: "admin"
  amqpPassword: "admin"

oidc:
  enabled: "true"
  authServerUrl: "https://rhbk.apps-crc.testing/realms/swim"
  clientId: "swim-dnotam-provider"
  clientSecret: "BtYGyfj6R1YvoKhEsDfjg0aMxSc8VyJ5"

serverCert:
  enabled: true
  issuerName: swim-ca-issuer
  issuerKind: ClusterIssuer

route:
  http:
    enabled: false
  mtls:
    enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}

serviceMonitor:
  enabled: false
