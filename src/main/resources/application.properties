# =============================================================================
# SWIM DNOTAM Provider - Common Configuration (All Profiles)
# =============================================================================
# Profile-specific configs: application-{dev,test,prod}.properties
# =============================================================================

quarkus.application.name=swim-dnotam-provider
quarkus.application.version=1.0.0-SNAPSHOT

quarkus.naming.enable-jndi=true

# =============================================================================
# HTTP Server
# =============================================================================

quarkus.http.port=8080
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=enabled

internal.server.port=${INTERNAL_SERVER_PORT:9080}

quarkus.http.auth.permission.public.paths=/q/*,/swagger-ui/*,/openapi
quarkus.http.auth.permission.public.policy=permit

quarkus.http.auth.permission.ping.paths=/swim/v1/subscriptions/ping
quarkus.http.auth.permission.ping.policy=permit

quarkus.http.auth.permission.cors-preflight.paths=/swim/*
quarkus.http.auth.permission.cors-preflight.policy=permit
quarkus.http.auth.permission.cors-preflight.methods=OPTIONS

quarkus.http.auth.permission.swim-api.paths=/swim/*
quarkus.http.auth.permission.swim-api.policy=authenticated

quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.management.enabled=false
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.title=SWIM DNOTAM Provider API
quarkus.swagger-ui.theme=flattop
quarkus.swagger-ui.doc-expansion=list

mp.openapi.servers=${OPENAPI_SERVERS}

# =============================================================================
# Security / OIDC / CORS
# =============================================================================

quarkus.oidc.enabled=${OIDC_ENABLED:true}
quarkus.oidc.application-type=service
quarkus.oidc.client-id=${OIDC_CLIENT_ID:swim-dnotam-provider}
quarkus.oidc.token.issuer=any

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# =============================================================================
# Database
# =============================================================================

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# =============================================================================
# Messaging - Kafka Incoming (Event Ingress)
# =============================================================================

mp.messaging.incoming.dnotam-events.connector=smallrye-kafka
mp.messaging.incoming.dnotam-events.topic=${KAFKA_TOPIC:dnotam-events-all-topic}
mp.messaging.incoming.dnotam-events.pattern=${KAFKA_PATTERN:false}
mp.messaging.incoming.dnotam-events.group.id=${KAFKA_GROUP_ID:swim-dnotam-provider}
mp.messaging.incoming.dnotam-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.dnotam-events.auto.offset.reset=earliest
mp.messaging.incoming.dnotam-events.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.incoming.dnotam-events.tracing-enabled=true
mp.messaging.incoming.dnotam-events.max.poll.records=${KAFKA_MAX_POLL_RECORDS:50}
mp.messaging.incoming.dnotam-events.pause-if-no-requests=true
mp.messaging.incoming.dnotam-events.requests=${KAFKA_REQUESTS:100}
mp.messaging.incoming.dnotam-events.commit-strategy=throttled
mp.messaging.incoming.dnotam-events.throttled.unprocessed-record-max-age.ms=60000
mp.messaging.incoming.dnotam-events.failure-strategy=ignore
mp.messaging.incoming.dnotam-events.reconnect.backoff.ms=1000
mp.messaging.incoming.dnotam-events.reconnect.backoff.max.ms=30000
mp.messaging.incoming.dnotam-events.retry.backoff.ms=500
mp.messaging.incoming.dnotam-events.session.timeout.ms=45000
mp.messaging.incoming.dnotam-events.request.timeout.ms=30000

# =============================================================================
# Messaging - AMQP Outgoing (Event Publishing to Subscribers)
# =============================================================================

mp.messaging.outgoing.dnotam-amqp-out.connector=smallrye-amqp
mp.messaging.outgoing.dnotam-amqp-out.tracing-enabled=true
mp.messaging.outgoing.dnotam-amqp-out.host=${amqp-host}
mp.messaging.outgoing.dnotam-amqp-out.port=${amqp-port}
mp.messaging.outgoing.dnotam-amqp-out.username=${amqp-username}
mp.messaging.outgoing.dnotam-amqp-out.password=${amqp-password}
mp.messaging.outgoing.dnotam-amqp-out.durable=true
mp.messaging.outgoing.dnotam-amqp-out.health-enabled=true
mp.messaging.outgoing.dnotam-amqp-out.connect-timeout=5000
mp.messaging.outgoing.dnotam-amqp-out.reconnect-attempts=100
mp.messaging.outgoing.dnotam-amqp-out.reconnect-interval=10
mp.messaging.outgoing.dnotam-amqp-out.container-id=swim-dnotam-provider

# =============================================================================
# SWIM Domain Configuration
# =============================================================================

swim.dnotam.service.version=${SWIM_DNOTAM_VERSION:1.0}

swim.topics=${SWIM_TOPICS:DigitalNOTAMService}

swim.kubernetes.namespace=${KUBERNETES_NAMESPACE:swim-demo}
swim.kubernetes.secret.address-configurations=${K8S_SECRET_ADDRESS:address-swim-configurations-bp}
swim.kubernetes.secret.security-roles=${K8S_SECRET_SECURITY:security-swim-roles-bp}

swim.amq.role.suffix=-swim-dnotam-v1-amq-role

swim.provider.outbox.event-address=outbox.deliver
swim.provider.metric-prefix=dnotam

swim.heartbeat.enabled=true
swim.heartbeat.interval=15s
swim.heartbeat.provider-id=${HOSTNAME:dnotam-provider-${RANDOM_UUID}}

swim.subscription.expiry.check-interval=60s
swim.subscription.expiry.purge-interval=5m
swim.subscription.expiry.purge-delay=1h
swim.subscription.expiry.default-ttl=24h
swim.subscription.expiry.max-ttl=168h

# =============================================================================
# Observability (Logging, OTel, Metrics)
# =============================================================================

quarkus.log.level=INFO
quarkus.log.category."com.github.swim_developer".level=${LOG_LEVEL:INFO}
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c] (%t) %s%e%n
quarkus.log.console.async.enabled=true
quarkus.log.console.async.queue-length=10000
quarkus.log.console.async.overflow=DISCARD

quarkus.otel.enabled=${OTEL_ENABLED:true}
quarkus.otel.sdk.disabled=${OTEL_SDK_DISABLED:false}
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://tempo-simplest-distributor.tempostack.svc.cluster.local:4317}
quarkus.otel.exporter.otlp.headers=${OTEL_HEADERS:}
quarkus.otel.resource.attributes=service.name=swim-dnotam-provider,service.version=1.0.0,k8s.namespace.name=${POD_NAMESPACE:unknown}

quarkus.management.enabled=true

quarkus.micrometer.enabled=${PROMETHEUS_ENABLED:true}
quarkus.micrometer.export.prometheus.enabled=${PROMETHEUS_ENABLED:true}
quarkus.micrometer.export.prometheus.path=/q/metrics

# =============================================================================
# Fault Tolerance
# =============================================================================

quarkus.fault-tolerance.enabled=true

quarkus.fault-tolerance."DnotamAmqpPublisher/publishToQueue".retry.max-retries=3
quarkus.fault-tolerance."DnotamAmqpPublisher/publishToQueue".retry.delay=1000
quarkus.fault-tolerance."DnotamAmqpPublisher/publishToQueue".retry.jitter=500
quarkus.fault-tolerance."DnotamAmqpPublisher/publishToQueue".timeout.value=5000

quarkus.fault-tolerance."DnotamEventProcessor/processEvent".retry.max-retries=2
quarkus.fault-tolerance."DnotamEventProcessor/processEvent".retry.delay=500
quarkus.fault-tolerance."DnotamEventProcessor/processEvent".timeout.value=10000
quarkus.fault-tolerance."DnotamEventProcessor/processEvent".circuit-breaker.request-volume-threshold=10
quarkus.fault-tolerance."DnotamEventProcessor/processEvent".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."DnotamEventProcessor/processEvent".circuit-breaker.delay=30000

quarkus.fault-tolerance."AbstractProviderSubscriptionService/listSubscriptions".retry.max-retries=3
quarkus.fault-tolerance."AbstractProviderSubscriptionService/listSubscriptions".retry.delay=1000
quarkus.fault-tolerance."AbstractProviderSubscriptionService/listSubscriptions".timeout.value=5000
quarkus.fault-tolerance."AbstractProviderSubscriptionService/listSubscriptions".circuit-breaker.request-volume-threshold=20
quarkus.fault-tolerance."AbstractProviderSubscriptionService/listSubscriptions".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."AbstractProviderSubscriptionService/listSubscriptions".circuit-breaker.delay=60000

quarkus.fault-tolerance."AbstractProviderSubscriptionService/getSubscription".retry.max-retries=3
quarkus.fault-tolerance."AbstractProviderSubscriptionService/getSubscription".retry.delay=1000
quarkus.fault-tolerance."AbstractProviderSubscriptionService/getSubscription".timeout.value=3000
quarkus.fault-tolerance."AbstractProviderSubscriptionService/getSubscription".circuit-breaker.request-volume-threshold=20
quarkus.fault-tolerance."AbstractProviderSubscriptionService/getSubscription".circuit-breaker.failure-ratio=0.5
quarkus.fault-tolerance."AbstractProviderSubscriptionService/getSubscription".circuit-breaker.delay=60000

quarkus.fault-tolerance."AbstractProviderSubscriptionService/createSubscription".retry.max-retries=2
quarkus.fault-tolerance."AbstractProviderSubscriptionService/createSubscription".retry.delay=500
quarkus.fault-tolerance."AbstractProviderSubscriptionService/createSubscription".timeout.value=30000

quarkus.fault-tolerance."AbstractProviderSubscriptionService/updateStatus".retry.max-retries=2
quarkus.fault-tolerance."AbstractProviderSubscriptionService/updateStatus".retry.delay=500
quarkus.fault-tolerance."AbstractProviderSubscriptionService/updateStatus".timeout.value=5000

quarkus.fault-tolerance."AbstractProviderSubscriptionService/deleteSubscription".retry.max-retries=2
quarkus.fault-tolerance."AbstractProviderSubscriptionService/deleteSubscription".retry.delay=500
quarkus.fault-tolerance."AbstractProviderSubscriptionService/deleteSubscription".timeout.value=15000

# =============================================================================
# SSL/TLS
# =============================================================================

quarkus.ssl.native=true

# =============================================================================
# Native Image
# =============================================================================
quarkus.index-dependency.aixm-model.group-id=com.github.swim-developer
quarkus.index-dependency.aixm-model.artifact-id=aixm-model
quarkus.native.resources.includes=META-INF/resources/**,internal/*.yaml,schemas/**,com/sun/org/apache/xerces/internal/impl/msg/**,com/sun/org/apache/xerces/internal/impl/xpath/regex/**
quarkus.native.additional-build-args=-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLSchemaMessages,-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.XMLMessages,-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.msg.SAXMessages,-H:IncludeResourceBundles=com.sun.org.apache.xerces.internal.impl.xpath.regex.message
